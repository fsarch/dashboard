name: build our image

on:
  workflow_run:
    workflows: ["CI - Tests"]
    types:
      - completed

jobs:
  build:
    runs-on: ubuntu-latest
    # Run only when the upstream workflow succeeded AND the head branch is one of the allowed branches
    if: ${{ github.event.workflow_run.conclusion == 'success' && contains(fromJson('["main","release"]'), github.event.workflow_run.head_branch) }}
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: 'npm'

      - name: Configure npm for GitHub Packages (fsarch scope)
        run: |
          echo "@fsarch:registry=https://npm.pkg.github.com" >> ~/.npmrc
          echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" >> ~/.npmrc
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install build dependencies
        run: |
          # install system deps needed for optional native builds (if any)
          apk=false
          if [ -f /etc/alpine-release ]; then apk=true; fi
          if $apk; then sudo apk add --no-cache python3 make g++ git build-base cairo-dev pango-dev giflib-dev jpeg-dev libpng-dev; fi
          npm ci

      - name: Prepare public assets
        run: |
          rm -rf ./public/assets/monaco
          cp -R ./node_modules/monaco-editor/min ./public/assets/monaco
          find ./public/assets/monaco -name '*.js.js' -type f -exec sh -c 'mv "$1" "${1%.js}"' _ {} \;

      - name: Build Next.js app
        run: |
          # Ensure Next telemetry is disabled in CI
          export NEXT_TELEMETRY_DISABLED=1
          # Use yarn if available in repo scripts, otherwise npm
          if [ -f yarn.lock ]; then yarn build; else npm run build; fi

      - name: install buildx
        id: buildx
        uses: crazy-max/ghaction-docker-buildx@v1
        with:
          version: latest
      - name: login to docker hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build and push Docker image (using prebuilt artifacts)
        env:
          DOCKER_BUILDKIT: 1
        run: |
          docker buildx build \
            --file Dockerfile.ci \
            --tag fsarch/dashboard:latest \
            --platform linux/amd64,linux/arm64 \
            --push .
