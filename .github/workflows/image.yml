name: build our image

on:
  workflow_run:
    workflows: ["CI - Tests"]
    types:
      - completed

jobs:
  build:
    runs-on: ubuntu-latest
    # Run only when the upstream workflow succeeded AND the head branch is one of the allowed branches
    if: ${{ github.event.workflow_run.conclusion == 'success' && contains(fromJson('["main","release"]'), github.event.workflow_run.head_branch) }}
    steps:
      - name: checkout code
        uses: actions/checkout@v4
        with:
          # Build the exact commit that passed the upstream test workflow.
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: 'npm'

      - name: Configure npm for GitHub Packages (fsarch scope)
        run: |
          echo "@fsarch:registry=https://npm.pkg.github.com" >> ~/.npmrc
          echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" >> ~/.npmrc
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js app
        run: |
          NEXT_TELEMETRY_DISABLED=1 npm run build

      - name: Verify Docker build artifacts
        run: |
          test -d .next/standalone
          test -d .next/static
          test -d node_modules
          test -f .next/standalone/server.js

      - name: install buildx
        uses: docker/setup-buildx-action@v3

      - name: login to docker hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image (using prebuilt artifacts)
        env:
          DOCKER_BUILDKIT: 1
        run: |
          docker buildx build \
            --file Dockerfile \
            --tag fsarch/dashboard:latest \
            --platform linux/amd64,linux/arm64 \
            --push .
