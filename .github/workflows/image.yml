name: build our image

on:
  workflow_run:
    workflows: ["CI - Tests"]
    types:
      - completed

jobs:
  build:
    runs-on: ubuntu-latest
    # Run only when the upstream workflow succeeded AND the trigger was one of the allowed
    # branches or a version tag. Note: for workflow_run events triggered by a tag push,
    # github.event.workflow_run.head_branch holds the tag name (e.g. "v1.2.3"), not a branch.
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        (
          contains(fromJson('["main","release"]'), github.event.workflow_run.head_branch) ||
          startsWith(github.event.workflow_run.head_branch, 'v')
        )
      }}
    steps:
      - name: checkout code
        uses: actions/checkout@v4
        with:
          # Build the exact commit that passed the upstream test workflow.
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: 'npm'

      - name: Configure npm for GitHub Packages (fsarch scope)
        run: |
          echo "@fsarch:registry=https://npm.pkg.github.com" >> ~/.npmrc
          echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" >> ~/.npmrc
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js app
        run: |
          NEXT_TELEMETRY_DISABLED=1 npm run build

      - name: Verify Docker build artifacts
        run: |
          test -d .next/standalone
          test -d .next/static
          test -d node_modules
          test -f .next/standalone/server.js

      - name: install buildx
        uses: docker/setup-buildx-action@v3

      - name: login to docker hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: determine image tags
        id: image
        env:
          # For workflow_run events, GITHUB_REF always reflects this workflow file's own
          # ref (the default branch), not the ref that triggered the upstream "CI - Tests"
          # run - so it can't be used to detect a tag push here. Use the workflow_run
          # payload instead, which holds the tag name (without the "refs/tags/" prefix)
          # in head_branch when the trigger was a tag push.
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          IMAGE=fsarch/dashboard
          if [[ "${HEAD_BRANCH}" == v* ]]; then
            VERSION="${HEAD_BRANCH#v}"
            TAGS="${IMAGE}:${VERSION}"
            # only mark proper releases (no prerelease suffix, e.g. -beta.0) as stable
            if [[ "${VERSION}" != *-* ]]; then
              TAGS="${TAGS} ${IMAGE}:stable"
              echo "stable=true" >> "$GITHUB_OUTPUT"
            else
              echo "stable=false" >> "$GITHUB_OUTPUT"
            fi
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          else
            TAGS="${IMAGE}:latest"
            echo "stable=false" >> "$GITHUB_OUTPUT"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
      - name: build the image
        run: |
          TAG_ARGS=""
          for tag in ${{ steps.image.outputs.tags }}; do
            TAG_ARGS="${TAG_ARGS} --tag ${tag}"
          done

          docker buildx build \
            ${TAG_ARGS} \
            --platform linux/amd64,linux/arm64 \
            --push .
      - name: notify helm-charts of the new release
        # success() is required here because a custom `if:` replaces the
        # step's implicit default (only run on success) - without it, this
        # would still fire even if "build the image" failed and neither the
        # version nor the :stable tag actually got pushed.
        # Only for proper releases (tags without a prerelease suffix), so
        # betas etc. don't bump the published chart.
        if: success() && steps.image.outputs.stable == 'true'
        run: |
          curl -sSf -X POST \
            -H "Authorization: Bearer ${{ secrets.HELM_CHARTS_DISPATCH_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/fsarch/helm-charts/dispatches \
            -d '{"event_type":"dashboard-released","client_payload":{"version":"${{ steps.image.outputs.version }}"}}'

