name: build our image

on:
  workflow_run:
    workflows: ["CI - Tests"]
    types:
      - completed

# Configure allowed branches here as a JSON array string
env:
  ALLOWED_BRANCHES: '["main","release"]'

jobs:
  build:
    runs-on: ubuntu-latest
    # Run only when the upstream workflow succeeded AND the head branch is in ALLOWED_BRANCHES
    if: ${{ github.event.workflow_run.conclusion == 'success' && contains(fromJson(env.ALLOWED_BRANCHES), github.event.workflow_run.head_branch) }}
    steps:
      - name: checkout code
        uses: actions/checkout@v2
      - name: install buildx
        id: buildx
        uses: crazy-max/ghaction-docker-buildx@v1
        with:
          version: latest
      - name: login to docker hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
      - name: build the image
        run: |
          docker buildx build \
            --tag fsarch/dashboard:latest \
            --platform linux/amd64,linux/arm64 \
            --push .
